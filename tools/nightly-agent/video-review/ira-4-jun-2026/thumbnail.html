<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:84px 92px;gap:28px}
  .glow{position:absolute;width:780px;height:780px;border-radius:50%;
    right:-240px;top:-280px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A02e 0%,transparent 68%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .kicker{position:relative;display:flex;align-items:center;gap:14px;
    font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0}
  .kicker .sep{opacity:.5;font-weight:500}
  .kicker .date{color:#ffffffa0;letter-spacing:.1em}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:80px;line-height:1.06;letter-spacing:-.018em;
    text-wrap:balance;max-width:14.5ch}
  .who{position:relative;display:flex;align-items:center;gap:15px;
    font-size:25px;font-weight:500;color:#ffffffb8}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:absolute;right:92px;bottom:84px;display:flex;align-items:flex-end;
    gap:6px;height:120px;opacity:.85}
  .wave i{display:block;width:7px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail"></div><div class="glow"></div><div class="grain"></div>
<div class="kicker">Vocal Mastery <span class="sep">·</span><span class="date">4.Jun.2026</span></div>
<h1>Lower the chin. The tension was never in the note.</h1>
<div class="who"><span class="dot"></span>Ira &amp; coach · omegabone.com</div>
<div class="wave">
  <i style="height:28px"></i><i style="height:52px"></i><i style="height:34px"></i>
  <i style="height:74px"></i><i style="height:46px"></i><i style="height:96px"></i>
  <i style="height:60px"></i><i style="height:38px"></i><i style="height:82px"></i>
  <i style="height:50px"></i><i style="height:30px"></i><i style="height:64px"></i>
</div>
