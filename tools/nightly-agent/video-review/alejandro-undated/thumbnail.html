<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:84px 92px;gap:30px}
  .glow{position:absolute;width:760px;height:760px;border-radius:50%;
    right:-230px;top:-270px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A02e 0%,transparent 68%)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .kicker{position:relative;font-size:23px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:70px;line-height:1.08;letter-spacing:-.018em;
    text-wrap:balance;max-width:16.5ch}
  .strike{color:#7CE8A0}
  .who{position:relative;display:flex;align-items:center;gap:15px;
    font-size:25px;font-weight:500;color:#ffffffb8}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0}
</style>
<div class="rail"></div><div class="glow"></div>
<div class="kicker">Vocal Mastery</div>
<h1>You're Not Tone&#8209;Deaf. <span class="strike">The Song Doesn't Fit You.</span></h1>
<div class="who"><span class="dot"></span>Alejandro &middot; omegabone.com</div>
