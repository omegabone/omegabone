<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;
    padding:80px 110px;gap:30px}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
    left:50%;top:-420px;transform:translateX(-50%);pointer-events:none;
    background:radial-gradient(circle,#7CE8A02a 0%,transparent 66%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail-l{position:absolute;left:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .rail-r{position:absolute;right:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .badge{position:relative;display:inline-flex;align-items:center;gap:10px;
    font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:#7CE8A0;border:2px solid #7CE8A0;padding:9px 22px;border-radius:999px}
  .kicker{position:relative;font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#ffffffa0}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:70px;line-height:1.08;letter-spacing:-.016em;
    text-wrap:balance;max-width:15ch}
  .song{position:relative;font-size:26px;font-weight:600;color:#7CE8A0}
  .who{position:relative;display:flex;align-items:center;justify-content:center;
    gap:15px;font-size:24px;font-weight:500;color:#ffffffb0}
  .dot{width:10px;height:10px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:relative;display:flex;align-items:flex-end;justify-content:center;
    gap:6px;height:70px;opacity:.75;margin-top:4px}
  .wave i{display:block;width:7px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail-l"></div><div class="rail-r"></div><div class="glow"></div><div class="grain"></div>
<div class="badge">Married 4 Days Ago</div>
<div class="kicker">Vocal Mastery</div>
<h1>"It's never been a true effort. It deserves one."</h1>
<div class="song">"Die With A Smile" — Kris's wedding song</div>
<div class="wave">
  <i style="height:20px"></i><i style="height:40px"></i><i style="height:58px"></i>
  <i style="height:30px"></i><i style="height:70px"></i><i style="height:44px"></i>
  <i style="height:66px"></i><i style="height:28px"></i><i style="height:52px"></i>
  <i style="height:36px"></i><i style="height:60px"></i><i style="height:22px"></i>
</div>
<div class="who"><span class="dot"></span>Kris · omegabone.com</div>
