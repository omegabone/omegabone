<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:76px 96px 88px;gap:26px}
  .glow{position:absolute;width:820px;height:820px;border-radius:50%;
    left:-260px;top:-320px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A030 0%,transparent 66%)}
  .glow2{position:absolute;width:520px;height:520px;border-radius:50%;
    right:-160px;bottom:-220px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A01c 0%,transparent 70%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail{position:absolute;right:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .kicker{position:relative;display:flex;align-items:center;gap:14px;
    font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0}
  .kicker .sep{opacity:.5;font-weight:500}
  .kicker .tag{color:#ffffffa0;letter-spacing:.1em}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:72px;line-height:1.08;letter-spacing:-.016em;
    text-wrap:balance;max-width:15.5ch}
  h1 em{font-style:normal;color:#7CE8A0}
  .who{position:relative;display:flex;align-items:center;gap:15px;
    font-size:25px;font-weight:500;color:#ffffffb8}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:absolute;left:96px;top:96px;display:flex;align-items:flex-start;
    gap:6px;height:110px;opacity:.7}
  .wave i{display:block;width:6px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail"></div><div class="glow"></div><div class="glow2"></div><div class="grain"></div>
<div class="wave">
  <i style="height:40px"></i><i style="height:70px"></i><i style="height:26px"></i>
  <i style="height:88px"></i><i style="height:50px"></i><i style="height:100px"></i>
  <i style="height:34px"></i><i style="height:64px"></i><i style="height:44px"></i>
</div>
<div class="kicker">Vocal Mastery <span class="sep">·</span><span class="tag">Anastasia · Day 2</span></div>
<h1>"You're not Anastasia. You're <em>Sasha Fierce.</em>"</h1>
<div class="who"><span class="dot"></span>Anastasia &amp; coach · omegabone.com</div>
