<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
    left:50%;top:50%;transform:translate(-50%,-58%);pointer-events:none;
    background:radial-gradient(circle,#7CE8A022 0%,transparent 62%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail{position:absolute;left:0;right:0;top:0;height:12px;background:#7CE8A0}
  .content{position:relative;height:100%;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;
    padding:0 130px;gap:30px}
  .kicker{display:flex;align-items:center;gap:14px;
    font-size:21px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0}
  .kicker .sep{opacity:.5;font-weight:500}
  .kicker .tag{color:#ffffffa0;letter-spacing:.1em}
  h1{font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:66px;line-height:1.1;letter-spacing:-.014em;
    text-wrap:balance;max-width:15ch}
  .sub{font-family:Fraunces,Georgia,serif;font-weight:600;font-style:italic;
    font-size:28px;color:#7CE8A0;opacity:.92}
  .who{display:flex;align-items:center;gap:15px;
    font-size:24px;font-weight:500;color:#ffffffb8}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);
    display:flex;align-items:flex-end;gap:7px;height:70px;opacity:.55}
  .wave i{display:block;width:7px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail"></div><div class="glow"></div><div class="grain"></div>
<div class="content">
  <div class="kicker">Vocal Mastery <span class="sep">·</span><span class="tag">Vlad</span></div>
  <h1>"I felt discarded like trash."</h1>
  <div class="sub">Two days of crying, then a warmup.</div>
  <div class="who"><span class="dot"></span>Vlad &amp; coach · omegabone.com</div>
</div>
<div class="wave">
  <i style="height:20px"></i><i style="height:38px"></i><i style="height:16px"></i>
  <i style="height:54px"></i><i style="height:28px"></i><i style="height:66px"></i>
  <i style="height:32px"></i><i style="height:46px"></i><i style="height:22px"></i>
  <i style="height:58px"></i><i style="height:36px"></i><i style="height:18px"></i>
</div>
