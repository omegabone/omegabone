<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#150c22;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    align-items:center;text-align:center;
    padding:76px 108px;gap:28px}
  .glow{position:absolute;width:820px;height:820px;border-radius:50%;
    left:-260px;top:-360px;pointer-events:none;
    background:radial-gradient(circle,#b98cf030 0%,transparent 68%)}
  .glow2{position:absolute;width:760px;height:760px;border-radius:50%;
    right:-300px;bottom:-360px;pointer-events:none;
    background:radial-gradient(circle,#4b2570 0%,transparent 70%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail-l{position:absolute;left:0;top:0;bottom:0;width:14px;background:#b98cf0}
  .rail-r{position:absolute;right:0;top:0;bottom:0;width:14px;background:#b98cf0}
  .badge{position:relative;display:inline-flex;align-items:center;gap:10px;
    font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:#b98cf0;border:2px solid #b98cf0;padding:9px 22px;border-radius:999px}
  .kicker{position:relative;font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#ffffffa0}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:60px;line-height:1.1;letter-spacing:-.014em;
    text-wrap:balance;max-width:17ch}
  h1 em{font-style:italic;color:#b98cf0}
  .sub{position:relative;font-size:24px;font-weight:600;color:#b98cf0}
  .who{position:relative;display:flex;align-items:center;justify-content:center;
    gap:15px;font-size:24px;font-weight:500;color:#ffffffb0}
  .dot{width:10px;height:10px;border-radius:50%;background:#b98cf0;flex:none}
  .wave{position:relative;display:flex;align-items:flex-end;justify-content:center;
    gap:6px;height:60px;opacity:.75;margin-top:2px}
  .wave i{display:block;width:7px;border-radius:4px;background:#b98cf0}
</style>
<div class="rail-l"></div><div class="rail-r"></div><div class="glow"></div><div class="glow2"></div><div class="grain"></div>
<div class="badge">Buzz The Story</div>
<div class="kicker">Learn 2 Sing</div>
<h1>Your <em>speaking</em> voice has to be on par with your <em>singing</em> voice.</h1>
<div class="sub">Same breath. Louder. Slower.</div>
<div class="wave">
  <i style="height:44px"></i><i style="height:20px"></i><i style="height:58px"></i>
  <i style="height:30px"></i><i style="height:62px"></i><i style="height:26px"></i>
  <i style="height:50px"></i><i style="height:34px"></i><i style="height:56px"></i>
  <i style="height:22px"></i><i style="height:46px"></i><i style="height:18px"></i>
</div>
<div class="who"><span class="dot"></span>Ira · omegabone.com</div>
