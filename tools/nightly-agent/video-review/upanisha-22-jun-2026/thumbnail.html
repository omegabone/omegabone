<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:center;
    align-items:flex-end;text-align:right;
    padding:84px 96px;gap:28px}
  .glow{position:absolute;width:760px;height:760px;border-radius:50%;
    left:-260px;top:-300px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A02c 0%,transparent 68%)}
  .glow2{position:absolute;width:460px;height:460px;border-radius:50%;
    left:120px;bottom:-220px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A014 0%,transparent 70%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail{position:absolute;left:0;top:0;bottom:0;width:14px;background:#7CE8A0}
  .route{position:relative;font-size:21px;font-weight:600;letter-spacing:.08em;
    color:#ffffff8c}
  .route b{color:#7CE8A0;font-weight:700}
  .kicker{position:relative;display:flex;align-items:center;justify-content:flex-end;
    gap:14px;font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0}
  .kicker .sep{opacity:.5;font-weight:500}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:66px;line-height:1.1;letter-spacing:-.014em;
    text-wrap:balance;max-width:16ch;margin-left:auto}
  .who{position:relative;display:flex;align-items:center;justify-content:flex-end;
    gap:15px;font-size:25px;font-weight:500;color:#ffffffb8}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:absolute;left:96px;bottom:90px;display:flex;align-items:flex-end;
    gap:6px;height:110px;opacity:.8}
  .wave i{display:block;width:7px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail"></div><div class="glow"></div><div class="glow2"></div><div class="grain"></div>
<div class="wave">
  <i style="height:22px"></i><i style="height:46px"></i><i style="height:30px"></i>
  <i style="height:68px"></i><i style="height:40px"></i><i style="height:88px"></i>
  <i style="height:54px"></i><i style="height:32px"></i><i style="height:74px"></i>
  <i style="height:44px"></i>
</div>
<div class="route">Chennai <b>&rarr;</b> Network School</div>
<div class="kicker">Vocal Mastery <span class="sep">·</span> First Vocal Lesson</div>
<h1>"You're going to need the power to make Skyfall shake."</h1>
<div class="who">Upanisha &amp; coach · omegabone.com<span class="dot"></span></div>
