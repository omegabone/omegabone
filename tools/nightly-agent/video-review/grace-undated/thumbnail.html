<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@500;600;700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{background:#081812;color:#ffffff;
    font-family:Inter,system-ui,sans-serif;position:relative;
    display:flex;flex-direction:column;justify-content:flex-start;
    padding:88px 100px;gap:26px}
  .glow{position:absolute;width:760px;height:760px;border-radius:50%;
    right:-220px;bottom:-300px;pointer-events:none;
    background:radial-gradient(circle,#7CE8A02e 0%,transparent 68%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(115deg,#ffffff 0 2px,transparent 2px 26px)}
  .rail{position:absolute;left:0;bottom:0;width:220px;height:14px;background:#7CE8A0}
  .rail2{position:absolute;left:0;bottom:0;top:0;width:14px;background:#7CE8A0}
  .kicker{position:relative;display:flex;align-items:center;gap:14px;
    font-size:22px;font-weight:700;letter-spacing:.19em;
    text-transform:uppercase;color:#7CE8A0;margin-left:20px}
  .kicker .sep{opacity:.5;font-weight:500}
  .kicker .tag{color:#ffffffa0;letter-spacing:.1em}
  h1{position:relative;font-family:Fraunces,Georgia,serif;font-weight:800;
    font-size:70px;line-height:1.1;letter-spacing:-.016em;
    text-wrap:balance;max-width:15.5ch;margin-left:20px}
  .sub{position:relative;font-family:Fraunces,Georgia,serif;font-weight:600;
    font-style:italic;font-size:30px;color:#7CE8A0;opacity:.9;margin-left:20px}
  .who{position:absolute;left:100px;bottom:76px;display:flex;align-items:center;gap:15px;
    font-size:25px;font-weight:500;color:#ffffffb8;margin-left:20px}
  .dot{width:11px;height:11px;border-radius:50%;background:#7CE8A0;flex:none}
  .wave{position:absolute;right:100px;top:96px;display:flex;align-items:flex-end;
    gap:6px;height:130px;opacity:.85}
  .wave i{display:block;width:7px;border-radius:4px;background:#7CE8A0}
</style>
<div class="rail2"></div><div class="glow"></div><div class="grain"></div>
<div class="kicker">Vocal Mastery <span class="sep">·</span><span class="tag">Grace</span></div>
<h1>"I don't want you to sound like Katy Perry."</h1>
<div class="sub">I want you to sound like you.</div>
<div class="wave">
  <i style="height:24px"></i><i style="height:48px"></i><i style="height:30px"></i>
  <i style="height:70px"></i><i style="height:40px"></i><i style="height:92px"></i>
  <i style="height:56px"></i><i style="height:34px"></i><i style="height:78px"></i>
</div>
<div class="who"><span class="dot"></span>Grace &amp; coach · omegabone.com</div>
